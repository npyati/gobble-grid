<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gobble Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one-screen arcade cabinet — score strip, yellow rule banner, 6×5 tile board, touch pad on tablets */
:root{
  --night:#15123f;
  --board:#201c5c;
  --tile:#2e2a80;
  --tile-edge:#433db0;
  --tile-eaten:#1a1750;
  --cream:#fff5dc;
  --muted:#aaa5e6;
  --sun:#ffd23f;
  --sun-dark:#c99700;
  --gob:#8fe36b;
  --gob-dark:#3c9637;
  --grumble:#ff6b5b;
  --wobble:#b98cff;
  --sneak:#ff9f43;
  --scram:#4fd1c5;
  --cyclops:#8f9bc4;
  --club:#a8703f;
  --berry:#d6407f;
  --ink:#151233;
  --scrim:rgba(12,10,40,.82);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;
  background-color:var(--night);
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.6px);
  background-size:22px 22px;
  color:var(--cream);
  font-family:var(--body);
  font-weight:800;
  overflow-x:hidden;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.app{
  max-width:880px;margin:0 auto;min-height:100%;box-sizing:border-box;
  display:flex;flex-direction:column;gap:10px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:clamp(26px,5vw,38px);color:var(--sun);text-shadow:0 3px 0 var(--berry);letter-spacing:.01em;line-height:1;margin:0}
.stats{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1}
.stat small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.lives{display:flex;gap:2px;min-height:26px}
.lives svg{width:26px;height:26px}
.tools{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--board);border:2px solid var(--tile-edge);color:var(--cream);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:20px;height:20px}
.iconbtn:hover{border-color:var(--sun)}

.rule{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--sun);color:var(--ink);border-radius:16px;
  padding:8px 18px;box-shadow:0 4px 0 var(--sun-dark);
}
.rule-main{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.rule .eat{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.rule .text{font-family:var(--display);font-size:clamp(22px,4.6vw,36px);line-height:1.1;text-wrap:balance}
.rule .left{font-size:14px;white-space:nowrap;background:var(--ink);color:var(--sun);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}

.stage{display:flex;justify-content:center}
.rule.boss{background:var(--grumble);box-shadow:0 4px 0 var(--berry);flex-wrap:wrap;row-gap:6px}
.bossrow{display:flex;align-items:center;gap:12px;width:100%}
.bossname{font-family:var(--display);font-size:clamp(18px,3.6vw,26px);color:var(--cream);text-shadow:0 2px 0 var(--ink);white-space:nowrap;letter-spacing:.02em}
.hp{flex:1;min-width:80px;height:18px;border-radius:999px;background:var(--ink);overflow:hidden;border:2px solid var(--ink)}
.hpfill{height:100%;width:100%;background:var(--sun);border-radius:999px;transition:width .35s ease-out}
.coach{display:flex;align-items:center;gap:12px;background:var(--cream);color:var(--ink);border-radius:16px;padding:10px 16px;
  box-shadow:0 4px 0 var(--sun-dark);position:relative}
.coach::after{content:"";position:absolute;bottom:-10px;left:44px;border:10px solid transparent;border-bottom:0;border-top-color:var(--cream)}
.coach-face{flex:none;width:46px;height:46px}
.coach-face svg{width:100%;height:100%}
.coach-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.coach-step{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--berry)}
.coach-text{font-size:clamp(15px,2.4vw,19px);line-height:1.35;text-wrap:pretty}
.coach.pop{animation:pop .3s ease-out}
.cell.target .t{animation:targetGlow .55s ease-in-out infinite alternate}
@keyframes targetGlow{from{box-shadow:inset 0 0 0 3px var(--gob),0 0 4px var(--gob)}to{box-shadow:inset 0 0 0 5px var(--gob),0 0 22px var(--gob)}}
.boss-stage{display:flex;justify-content:center;height:100px;margin-bottom:-18px;position:relative;z-index:1;pointer-events:none}
.boss-stage svg{height:100%;width:auto;overflow:visible}
.cyclops .club{transform-box:view-box;transform-origin:150px 72px;transition:transform .25s ease-out}
.cyclops.raise .club{transform:rotate(-40deg)}
.cyclops.swing .club{animation:swing .4s ease-in}
@keyframes swing{0%{transform:rotate(-40deg)}55%{transform:rotate(85deg)}100%{transform:rotate(0)}}
.cyclops.ouch{animation:ouch .3s}
@keyframes ouch{25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}
.cyclops.defeated{transition:transform .8s ease-in,opacity .8s;transform:translateY(40px) rotate(12deg);opacity:.3}
.smash{position:absolute;left:0;right:0;height:20%;z-index:4;pointer-events:none;border-radius:12px;
  background:rgba(255,107,91,.3);box-shadow:inset 0 0 0 4px var(--grumble);animation:flash .3s ease-in-out infinite alternate;
  display:grid;place-items:center}
@keyframes flash{from{opacity:.45}to{opacity:1}}
.smash.hit{animation:none;background:rgba(255,107,91,.65)}
.smash.col{right:auto;top:0;height:100%}
.smash.col span{writing-mode:vertical-rl;text-orientation:upright;font-size:calc(5cqw * var(--k))}
.cyclops.angry{--cyclops:#d9677e}
.cyclops.angry .club{filter:drop-shadow(0 0 6px var(--grumble))}
.rule.boss.enraged .hpfill{background:var(--berry)}
.rule.boss.enraged .bossname::after{content:" (angry!)";color:var(--sun)}
.boss-msg{position:absolute;left:0;right:0;top:38%;z-index:6;text-align:center;pointer-events:none;
  font-family:var(--display);font-size:calc(8cqw * var(--k));color:var(--sun);text-shadow:0 4px 0 var(--berry),0 0 18px var(--ink);
  animation:angry 1.8s ease-out forwards}
@keyframes angry{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.smash span{font-family:var(--display);font-size:calc(9cqw * var(--k));color:var(--cream);text-shadow:0 3px 0 var(--ink)}
.board.shake{animation:shake .4s}
.card-sprite.wide{width:200px;height:110px}
.board:focus{outline:none}
.board{
  position:relative;box-sizing:border-box;
  --cols:6; --k:1; --extra:0px;
  width:min(100%, calc((100dvh - 250px - var(--extra)) * var(--cols) / 5));
  min-width:min(100%, 300px);max-width:100%;
  aspect-ratio:var(--cols)/5;
  container-type:inline-size;
  background:var(--board);border:4px solid var(--tile-edge);border-radius:20px;
  overflow:hidden;
}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(5,1fr)}
.cell{position:relative;cursor:pointer}
.cell .t{
  position:absolute;inset:5%;border-radius:12px;
  background:var(--tile);border-bottom:4px solid var(--tile-edge);
  display:grid;place-items:center;
  font-size:calc(6cqw * var(--k));font-weight:900;font-variant-numeric:tabular-nums;color:var(--cream);
  transition:background .2s;
}
.cell.long .t{font-size:calc(4.4cqw * var(--k))}
.cell.xlong .t{font-size:calc(3.3cqw * var(--k))}
.cell.xxlong .t{font-size:calc(2.6cqw * var(--k))}
.cell.eq .t{font-size:calc(3.4cqw * var(--k))}
.cell.eq .n{white-space:normal;text-align:center;line-height:1.15}
.cell.xxlong .n{white-space:normal;text-align:center;overflow-wrap:anywhere;padding:0 4%;line-height:1.1}
.cell.fr .t{font-size:calc(4.2cqw * var(--k))}
.cell .n{display:inline-block;transition:transform .22s cubic-bezier(.5,-.5,.7,1),opacity .22s;white-space:nowrap}
.cell.eaten .t{background:var(--tile-eaten);border-bottom-color:transparent}
.cell.eaten .n{transform:scale(0);opacity:0}
.cell.here .t{place-items:start center;padding-top:3%;box-shadow:inset 0 0 0 3px var(--sun)}
.cell.wrong .t{background:var(--grumble);animation:shake .45s}
.cell.reveal .t{background:var(--gob);color:var(--ink);box-shadow:0 0 0 3px var(--sun),0 0 22px var(--gob);transition:none}
.sprite.hint{z-index:1;place-items:start end;padding:7%;box-sizing:border-box}
.sprite.hint span{
  width:38%;aspect-ratio:1;border-radius:22%;display:grid;place-items:center;
  background:var(--sun);color:var(--ink);font-family:var(--display);font-size:calc(4.6cqw * var(--k));
  box-shadow:0 0 0 3px var(--ink),0 0 16px var(--sun);animation:bob .7s ease-in-out infinite alternate;
}
@keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-12%) rotate(6deg)}}
@keyframes shake{20%{transform:translateX(-6%)}40%{transform:translateX(6%)}60%{transform:translateX(-4%)}80%{transform:translateX(3%)}}

sup{font-size:.6em;line-height:0;vertical-align:.7em}
.rad{border-top:.08em solid currentColor;padding:.04em .06em 0;margin-left:-.04em}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle}
.frac span:first-child{border-bottom:.09em solid currentColor;padding:0 .18em .04em}
.frac span:last-child{padding-top:.04em}

.sprites{position:absolute;inset:0;pointer-events:none}
.sprite{position:absolute;width:calc(100% / var(--cols));height:20%;display:grid;place-items:center;transition:left .2s ease,top .2s ease}
.sprite svg{width:80%;height:80%;overflow:visible}
.sprite.player{z-index:2;place-items:end center;padding-bottom:4%;box-sizing:border-box}
.sprite.player svg{width:58%;height:58%}
.sprite.player.left svg{transform:scaleX(-1)}
.sprite.player.chomp .mouth{animation:chomp .28s}
.mouth{transform-box:fill-box;transform-origin:50% 0}
@keyframes chomp{0%{transform:scaleY(1)}40%{transform:scaleY(.12)}100%{transform:scaleY(1)}}
.sprite.monster{z-index:3;transition:left .3s linear,top .3s linear}
.sprite.monster.wobbler svg{animation:wobble .6s ease-in-out infinite alternate}
@keyframes wobble{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.sprite.monster.scrambler svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sprite.monster.sneaker svg{animation:creep .5s ease-in-out infinite alternate}
@keyframes creep{from{transform:translateY(0) scaleY(1)}to{transform:translateY(4%) scaleY(.94)}}
.sprite.warn.wobbler span{background:var(--wobble)}
.sprite.warn.sneaker span{background:var(--sneak)}
.sprite.warn.scrambler span{background:var(--scram)}
.cell.fresh .n{animation:popin .35s ease-out}
@keyframes popin{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.sprite.warn{z-index:1}
.sprite.warn span{
  width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:var(--grumble);color:var(--cream);font-family:var(--display);font-size:calc(7cqw * var(--k));
  animation:pulse .4s ease-in-out infinite alternate;
}
@keyframes pulse{from{transform:scale(.8);opacity:.6}to{transform:scale(1.1);opacity:1}}

.help{text-align:center;color:var(--muted);font-size:14px;margin:0}
.help kbd{font-family:var(--body);background:var(--board);border:1px solid var(--tile-edge);border-radius:6px;padding:1px 6px;color:var(--cream)}

.pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,56px);gap:6px;justify-content:center}
.pad button{border-radius:14px;background:var(--board);border:2px solid var(--tile-edge);color:var(--cream);font-size:24px;cursor:pointer;touch-action:none}
.pad button:active{background:var(--tile)}
.pad .eatbtn{background:var(--gob);color:var(--ink);font-family:var(--display);font-size:18px;border-color:var(--gob-dark)}
.pad .up{grid-area:1/2}.pad .lt{grid-area:2/1}.pad .eatbtn{grid-area:2/2}.pad .rt{grid-area:2/3}.pad .dn{grid-area:3/2}
@media (pointer:coarse){.pad{display:grid}.help.keys{display:none}}

.overlay{
  position:fixed;inset:0;z-index:20;background:var(--scrim);
  display:flex;overflow-y:auto;box-sizing:border-box;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.card{
  width:100%;max-width:540px;box-sizing:border-box;margin:auto;
  background:var(--board);border:4px solid var(--tile-edge);border-radius:24px;
  padding:22px 22px 24px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  animation:pop .25s ease-out;
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);color:var(--sun);margin:0;line-height:1.05;text-wrap:balance}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,10vw,60px);color:var(--sun);text-shadow:0 4px 0 var(--berry);margin:0;line-height:1}
.card p{margin:0;font-size:18px;line-height:1.4;max-width:42ch}
.card .why{font-size:22px;background:var(--tile);border-radius:14px;padding:12px 16px}
.card .small{font-size:14px;color:var(--muted)}
.card-sprite{width:96px;height:96px}
.card-sprite svg{width:100%;height:100%}
.card-sprite.bounce{animation:bounce .7s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.card-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.field{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.field .label{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font:inherit;font-size:15px;color:var(--cream);background:var(--tile);border:2px solid var(--tile-edge);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.chip.big{font-family:var(--display);font-weight:400;font-size:20px;padding:10px 20px}
.btn{
  font-family:var(--display);font-size:22px;color:var(--ink);background:var(--gob);
  border:none;border-radius:14px;padding:12px 26px;cursor:pointer;
  box-shadow:0 5px 0 var(--gob-dark);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gob-dark)}
.btn.ghost{background:var(--tile);color:var(--cream);box-shadow:0 5px 0 var(--tile-edge)}
.cast{display:flex;gap:18px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.cast div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.cast svg{width:52px;height:52px}
button:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.in{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.in span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card input,.card textarea{
  font:inherit;font-size:16px;font-weight:700;color:var(--cream);background:var(--tile);
  border:2px solid var(--tile-edge);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box;resize:vertical;
  -webkit-user-select:text;user-select:text;
}
.card input:focus,.card textarea:focus{outline:none;border-color:var(--sun)}
.card .err{color:var(--grumble);font-size:16px}
.mine{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--tile);border-radius:12px;padding:8px 8px 8px 14px;box-sizing:border-box;text-align:left}
.mine span{min-width:0;overflow-wrap:anywhere}
.mine small{color:var(--muted)}
.share{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.share summary{cursor:pointer;color:var(--muted);font-size:14px}
.share[open]{display:flex}
.share > * + *{margin-top:8px}

@media (max-width:520px){
  .stats{gap:12px}
  .stat b{font-size:20px}
  .lives svg{width:20px;height:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1 class="logo">Gobble Grid</h1>
    <div class="stats">
      <div class="stat"><small>Score</small><b id="score">0</b></div>
      <div class="stat"><small>Level</small><b id="level">1</b></div>
      <div class="stat"><small>Lives</small><div class="lives" id="lives"></div></div>
      <div class="tools">
        <button class="iconbtn" id="musicBtn" aria-label="Music on"></button>
        <button class="iconbtn" id="soundBtn" aria-label="Sound on"></button>
        <button class="iconbtn" id="pauseBtn" aria-label="Pause">
          <svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="rule" id="ruleBar">
    <div class="bossrow" id="bossRow" hidden><span class="bossname">9th Grade Cyclops</span><div class="hp"><div class="hpfill" id="hpFill"></div></div></div>
    <div class="rule-main"><span class="eat">Gobble</span><span class="text" id="ruleText">Even numbers</span></div>
    <span class="left" id="left">0 left</span>
  </div>

  <div class="boss-stage" id="bossStage" hidden></div>
  <div class="coach" id="coach" hidden>
    <div class="coach-face" id="coachFace"></div>
    <div class="coach-body"><div class="coach-step" id="coachStep"></div><div class="coach-text" id="coachText"></div></div>
  </div>
  <div class="stage">
    <div class="board" id="board" tabindex="-1">
      <div class="grid" id="grid"></div>
      <div class="sprites" id="sprites"></div>
    </div>
  </div>

  <p class="help keys"><kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> move · <kbd>Space</kbd> gobble · <kbd>P</kbd> pause · or click a square</p>
  <div class="pad" id="pad">
    <button class="up" data-act="up" tabindex="-1" aria-label="Up">▲</button>
    <button class="lt" data-act="left" tabindex="-1" aria-label="Left">◀</button>
    <button class="eatbtn" data-act="eat" tabindex="-1">Gobble</button>
    <button class="rt" data-act="right" tabindex="-1" aria-label="Right">▶</button>
    <button class="dn" data-act="down" tabindex="-1" aria-label="Down">▼</button>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
let COLS = 6; const ROWS = 5;
const $ = s => document.querySelector(s);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const frac = (p, q) => `<span class="frac"><span>${p}</span><span>${q}</span></span>`;
const spaced = s => String(s).replace(/([×+−÷])/g, ' $1 ');
const divRem = (a, b) => `${a} ÷ ${b} = ${Math.floor(a / b)} R${a % b}`;
const neg = n => n < 0 ? `−${-n}` : `${n}`;
const paren = n => n < 0 ? `(−${-n})` : `${n}`;
const pow = (a, b) => `${a}<sup>${b}</sup>`;
const rt = n => `√<span class="rad">${n}</span>`;   // the bar over the number shows exactly what's under the root
const fmtH = h => (h % 10 === 0 ? (h / 100).toFixed(1) : (h / 100).toFixed(2));
const smallestFactor = n => { for (let f = 2; f * f <= n; f++) if (n % f === 0) return f; return n; };

}

/* ---------- Word-list topics ----------
   The easiest way to add a topic: give a rule, things that fit it, and things that don't.
   `why` is optional; it explains a wrong gobble. */
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
function listTopic({ key, label, text, yes, no, why }) {
  return { key, label: label || text, make() { return { text: esc(text),
    good: () => ({ html: esc(pick(yes)) }),
    bad: () => { const w = pick(no); return { html: esc(w), why: why ? why(esc(w)) : `<b>${esc(w)}</b> doesn't fit “${esc(text)}”.` }; } }; } };
}

/* ---------- Blends (for Word sort) ----------
   A blend is two consonants where you still hear both sounds (bl, st). A digraph makes one new sound (sh, ch, th). */
const BLEND_WORDS = {
  bl: ['black','blue','block','blow','blink','blank','blob'], cl: ['clap','clock','clam','clip','clown','class','cliff'],
  fl: ['flag','flat','flip','fly','flop','flash'],            gl: ['glad','glass','glow','glue','globe'],
  pl: ['plan','plant','plum','play','plus','plate'],          sl: ['sled','slip','slam','slow','slide','slug'],
  br: ['brick','bring','brown','brush','bread'],              cr: ['crab','crib','crop','cry','crown','crisp'],
  dr: ['drum','drip','drop','dress','drink','draw'],          fr: ['frog','from','fresh','fruit','free'],
  gr: ['grab','grin','grass','green','grow'],                 pr: ['press','prize','print','prop'],
  tr: ['trip','trap','tree','truck','train','trick'],         st: ['stop','step','star','stick','stamp','still'],
  sn: ['snap','snack','snow','snake','sniff'],                sp: ['spin','spot','spell','speed','spoon'],
  sk: ['skip','skin','skate','sky','skunk'],                  sw: ['swim','swing','swan','sweet'],
  sm: ['smell','small','smile','smog'],
};
const SINGLE_START = { b: ['bat','bed','bus'], c: ['cat','cup','cot'], d: ['dog','dig','den'], f: ['fan','fun','fox'],
  g: ['gum','got','gas'], p: ['pig','pen','pot'], s: ['sun','sit','sad'], t: ['top','ten','tub'] };
const DIGRAPH_START = ['ship','shop','shell','chip','chin','chop','thin','thick','that','whale','when','phone'];
const END_BLEND = ['nest','fast','hand','sand','jump','lamp','gift','soft','belt','milk','desk','mask','best','pond','camp','raft','melt','list'];
const END_DIGRAPH = ['fish','dish','bath','moth','much','rich','sock','duck'];
const END_SINGLE = ['cat','bed','sun','hop','bag','wet','pin','tub'];
const blendOf = w => Object.keys(BLEND_WORDS).find(b => BLEND_WORDS[b].includes(w));
const ALL_BLEND_WORDS = Object.values(BLEND_WORDS).flat();
const q = s => `“${s}”`;
const BLEND_TOPICS = [
  { key:'blend-start', label:'Starts with a blend', make(){ return { text:'Starts with a blend',
    good:() => ({ html: pick(ALL_BLEND_WORDS) }),
    bad:() => { if (Math.random() < .4) { const w = pick(DIGRAPH_START), d = w.slice(0, 2);
        return { html: w, why:`<b>${w}</b> starts with ${q(d)}, which makes one new sound. That's a digraph, not a blend.` }; }
      const w = pick(Object.values(SINGLE_START).flat()); return { html: w, why:`<b>${w}</b> starts with just one consonant sound, ${q(w[0])}.` }; } }; } },
  { key:'blend-which', label:'Which blend?', make(){ const B = pick(Object.keys(BLEND_WORDS));
    const lookalikes = Object.keys(BLEND_WORDS).filter(b => b !== B && (b[0] === B[0] || b[1] === B[1])).flatMap(b => BLEND_WORDS[b]);
    const singles = SINGLE_START[B[0]] || [];
    return { text:`Starts with ${q(B)}`,
      good:() => ({ html: pick(BLEND_WORDS[B]) }),
      bad:() => { if (singles.length && Math.random() < .3) { const w = pick(singles);
          return { html: w, why:`<b>${w}</b> starts with just ${q(w[0])}. You need ${q(B)}.` }; }
        const w = pick(lookalikes); return { html: w, why:`<b>${w}</b> starts with ${q(blendOf(w))}, not ${q(B)}.` }; } }; } },
  { key:'blend-end', label:'Ends with a blend', make(){ return { text:'Ends with a blend',
    good:() => ({ html: pick(END_BLEND) }),
    bad:() => { if (Math.random() < .5) { const w = pick(END_DIGRAPH), d = w.slice(-2);
        return { html: w, why:`<b>${w}</b> ends with ${q(d)}, which makes one sound. That's a digraph, not a blend.` }; }
      const w = pick(END_SINGLE); return { html: w, why:`<b>${w}</b> ends with just one consonant sound, ${q(w.slice(-1))}.` }; } }; } },
];

/* ---------- Modules ----------

   To add one, append to MODULES:
     { id: 'unique-id', name: 'Shown in menu', pace: 'gentle' | 'fast', topics: [ ... ] }
   Each topic is either listTopic({...}) or a generator:
     { key, label, make() { return { text, good: () => ({ html }), bad: () => ({ html, why }) } } }
   good() returns something that fits the rule; bad() returns something that doesn't, plus why. */

    if (side === 0) { sr = ri(0, ROWS - 1); sc = -1; dr = 0; dc = 1; }
    else if (side === 1) { sr = ri(0, ROWS - 1); sc = COLS; dr = 0; dc = -1; }
    else if (side === 2) { sr = -1; sc = ri(0, COLS - 1); dr = 1; dc = 0; }
    else { sr = ROWS; sc = ri(0, COLS - 1); dr = -1; dc = 0; }
    const er = sr + dr, ec = sc + dc;
    if (Math.abs(er - state.player.r) + Math.abs(ec - state.player.c) <= 1) continue;
    if (state.warns.some(w => w.er === er && w.ec === ec)) continue;
    const type = forcedType || pickMonsterType();
    const el = document.createElement('div');
    el.className = 'sprite warn ' + type; el.innerHTML = '<span>!</span>';

}
function pickMonsterType() {

  for (const [k, t] of pool) { x -= t.weight; if (x <= 0) return k; }

}

const DIR4 = [[0,1],[0,-1],[1,0],[-1,0]];

/* ---------- Flow ---------- */
const overlay = $('#overlay'), card = $('#card');

const boardEl = $('#board');

}

  setTimeout(() => showCard({
    title: `Level ${state.level} done!`,

}

const BOSS_HP = 20;

    const g = b.dataset.group, v = b.dataset.val;
    if (g === 'module') { store.module = v; store.topic = 'mix'; }
    else store[g] = v;
    save(); showMenu();
    card.querySelector(`.chip[data-group="${g}"][data-val="${CSS.escape(v)}"]`)?.focus({ preventScroll: true });
  });
  $('#makeBtn').onclick = () => showEditor();
  $('#playBtn').onclick = () => { audioInit(); startGame(); };
  $('#tutBtn').onclick = () => { audioInit(); startTutorial(); };
  overlay.hidden = false; cardOpenedAt = performance.now();
  (store.tutorialSeen ? $('#playBtn') : $('#tutBtn')).focus({ preventScroll: true });
}

/* ---------- Tutorial ----------
   A practice level with a coach bubble. Each step waits for the player to do something, then moves on.
   Nothing in the tutorial costs a life. */
const TUTORIAL_TOPIC = { key: 'tutorial', make() { return { text: 'Even numbers',
  good: () => ({ html: 2 * ri(1, 10) }),
  bad: () => { const n = 2 * ri(0, 9) + 1; return { html: n, why: `${n} is odd. Even numbers end in 0, 2, 4, 6 or 8.` }; } }; } };
const TUT_STEPS = [
  { text: () => `This is you, the <b>Gobbler</b>! Move with the <b>arrow keys</b>, or tap a square to walk toward it. Walk to the <b>glowing green square</b>.`,
    setup() {
      const p = state.player, r = Math.min(ROWS - 1, p.r + 1), c = p.c + 2 < COLS ? p.c + 2 : p.c - 2;
      state.tut.target = r * COLS + c; cellEls[state.tut.target].classList.add('target');
    },
    done: e => e === 'move' && state.player.r * COLS + state.player.c === state.tut.target,
    after() { cellEls.forEach(el => el.classList.remove('target')); } },
  { text: () => `The yellow bar shows the <b>rule</b>: <b>Even numbers</b>. Walk onto an even number and press <b>Space</b> (or tap your Gobbler) to gobble it.`,
    done: e => e === 'good' },
  { text: () => `Yum! Now gobble an <b>odd</b> number on purpose, just to see what happens when you get one wrong.`,
    done: e => e === 'bad' },
  { text: () => `See the yellow <b>?</b> block next to you? It's a <b>hint</b>. Gobble it and every right answer flashes for a split second. Watch closely!`,
    setup() {
      const p = state.player, spots = [[0, 1], [0, -1], [1, 0], [-1, 0]].map(([dr, dc]) => [p.r + dr, p.c + dc]).filter(([r, c]) => inGrid(r, c));
      const [r, c] = pick(spots); spawnHint(r * COLS + c);
    },
    done: e => e === 'hint' },
  { text: () => `Uh oh, a <b>monster</b>! A flashing <b>!</b> shows where it's coming in. Stay out of its way until it walks off the board.`,
    setup() {   // a short pause first, so the hint flash and the monster don't happen at the same moment
      const step = state.tut.step;
      setTimeout(() => { if (state.phase === 'tutorial' && state.tut && state.tut.step === step) startWarning(false, 'grumble'); }, 1500);
    },
    done: e => e === 'monster-gone',
    retry: e => e === 'caught' },
  { text: () => `You've got it! Now gobble <b>every</b> even number to clear the board. The bar shows how many are left.`,
    done: e => e === 'clear' },
];
function startTutorial() {
  clearMonsters(); exitBoss();
  state.level = 1; state.score = 0; state.lives = 3; state.ruleKey = null;
  state.phase = 'tutorial'; state.tut = { step: 0 };
  $('#coachFace').innerHTML = gobblerSVG();
  $('#coach').hidden = false;
  $('#board').style.setProperty('--extra', '80px');
  buildLevel();
  resume();
  showTutStep();
}
function showTutStep() {
  const s = TUT_STEPS[state.tut.step];
  $('#coachStep').textContent = `Tutorial · step ${state.tut.step + 1} of ${TUT_STEPS.length}`;
  $('#coachText').innerHTML = s.text();
  const coach = $('#coach'); coach.classList.remove('pop'); void coach.offsetWidth; coach.classList.add('pop');
  if (s.setup) s.setup();
}
function tutEvent(e) {
  if (state.phase !== 'tutorial' || !state.tut) return;
  const s = TUT_STEPS[state.tut.step];
  if (s.retry && s.retry(e)) { if (s.setup) s.setup(); return; }   // e.g. the monster caught you: send another one
  if (!s.done(e)) return;
  if (s.after) s.after();
  state.tut.step++;
  sfx('hint');
  if (state.tut.step >= TUT_STEPS.length) return finishTutorial();
  showTutStep();
}
function tutorialBoardCleared() {
  if (TUT_STEPS[state.tut.step].done('clear')) return tutEvent('clear');
  // Cleared the board before the last step: put a few more even numbers out so the lesson can continue.
  const here = state.player.r * COLS + state.player.c;
  shuffle(state.cells.map((c, i) => i).filter(i => state.cells[i].eaten && i !== here)).slice(0, 4).forEach(i => setCell(i, true));
  hud();
}
function finishTutorial() {
  state.screen = 'clear'; clearMonsters(); sfx('level');
  store.tutorialSeen = true; save();
  setTimeout(() => showCard({
    title: `You're ready!`,
    html: `<p>Every level has a new rule. Gobble everything that fits, dodge the monsters, and grab the <b>?</b> for a hint.</p>
      <p><b>Every 3 levels, a Cyclops boss shows up.</b> Get 20 right to beat it. When a row flashes red, get out of it before the club comes down. At 10 health it gets angry and hits a row <b>and</b> a column every 5 seconds!</p>`,
    sprite: { svg: cyclopsSVG(), cls: 'wide bounce' },
    buttons: [{ label: 'Play', primary: true, action: startGame }, { label: 'Menu', action: showMenu }]
  }, 'over'), 400);
}

/* ---------- Make-your-own editor ---------- */
const splitList = s => [...new Set(String(s).split(/[\n,]+/).map(x => x.trim()).filter(Boolean))];
function showEditor(msg = '') {
  state.screen = 'menu';
  const list = store.custom.map((t, i) => `<div class="mine"><span>${esc(t.text)} <small>(${t.yes.length} fit, ${t.no.length} don't)</small></span>
      <button class="chip" data-del="${i}">Delete</button></div>`).join('');
  card.innerHTML = `
    <h2>Make your own topic</h2>
    <p class="small">Type a rule, then list things that fit it and things that don't. Separate them with commas or new lines. Use short words or numbers so they fit on a square.</p>
    <label class="in"><span>Rule</span><input id="ruleIn" maxlength="40" placeholder="e.g. Animals that live in water"></label>
    <label class="in"><span>Fits the rule (at least 3)</span><textarea id="yesIn" rows="3" placeholder="fish, whale, crab, shark, octopus, seal"></textarea></label>
    <label class="in"><span>Doesn't fit (at least 3)</span><textarea id="noIn" rows="3" placeholder="dog, horse, eagle, cow, bear, lion"></textarea></label>
    ${msg ? `<p class="err">${msg}</p>` : ''}
    <div class="card-actions"><button class="btn" data-primary id="saveTopic">Save topic</button><button class="btn ghost" id="backBtn">Back</button></div>
    ${list ? `<div class="field"><div class="label">My topics</div>${list}</div>` : ''}
    <details class="share"><summary>Share topics between devices</summary>
      <p class="small">Copy this code to another device and paste it there to bring your topics along.</p>
      <textarea id="shareIn" rows="3">${esc(JSON.stringify(store.custom))}</textarea>
      <div class="card-actions"><button class="chip" id="copyBtn">Copy code</button><button class="chip" id="importBtn">Add topics from pasted code</button></div>
    </details>`;
  overlay.hidden = false; cardOpenedAt = performance.now();
  $('#ruleIn').focus({ preventScroll: true });
  $('#backBtn').onclick = showMenu;
  $('#saveTopic').onclick = () => {
    const text = $('#ruleIn').value.trim(), yes = splitList($('#yesIn').value), no = splitList($('#noIn').value);
    if (!text) return showEditor('Give your topic a rule first.');
    if (yes.length < 3 || no.length < 3) return showEditor(`Add at least 3 of each. You have ${yes.length} that fit and ${no.length} that don't.`);
    const key = 'c' + Date.now().toString(36);
    store.custom.push({ key, text, yes, no });
    store.module = 'custom'; store.topic = key; save(); showMenu();
  };
  card.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    store.custom.splice(+b.dataset.del, 1);
    if (!store.custom.length && store.module === 'custom') store.module = 'g2';
    save(); showEditor();
  });
  $('#copyBtn').onclick = () => {
    const ta = $('#shareIn');
    navigator.clipboard?.writeText(ta.value).then(() => { $('#copyBtn').textContent = 'Copied'; }, () => { ta.select(); });
    if (!navigator.clipboard) ta.select();
  };
  $('#importBtn').onclick = () => {
    try {
      const arr = JSON.parse($('#shareIn').value);
      const ok = arr.filter(t => t && t.text && Array.isArray(t.yes) && Array.isArray(t.no) && t.yes.length >= 3 && t.no.length >= 3)
        .map(t => ({ key: 'c' + Math.random().toString(36).slice(2, 9), text: String(t.text).slice(0, 40), yes: t.yes.map(String), no: t.no.map(String) }));
      const have = new Set(store.custom.map(t => t.text + '|' + t.yes.join()));
      ok.forEach(t => { if (!have.has(t.text + '|' + t.yes.join())) store.custom.push(t); });
      save(); showEditor(`Added ${ok.length} topic${ok.length === 1 ? '' : 's'}.`);
    } catch (e) { showEditor("That code didn't work. Paste the whole code you copied."); }
  };
}

/* ---------- Input ---------- */
const DIRS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1], w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1],
  up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!overlay.hidden) {
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SUMMARY') return;
    if (k === 'Enter' || k === ' ') {
      e.preventDefault();
      if (e.repeat || performance.now() - cardOpenedAt < 400) return;
      const f = document.activeElement;
      if (f && f.tagName === 'BUTTON' && card.contains(f)) f.click();
      else card.querySelector('[data-primary]')?.click();
    }
    return;
  }
  if (state.screen !== 'play') return;
  if (DIRS[k]) { e.preventDefault(); move(...DIRS[k]); }
  else if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!e.repeat) eat(); }
  else if (k === 'p' || k === 'Escape') { e.preventDefault(); pause(); }
});
gridEl.addEventListener('pointerdown', e => {
  const cell = e.target.closest('.cell'); if (!cell || state.screen !== 'play') return;
  e.preventDefault(); audioInit();
  const i = +cell.dataset.i, r = Math.floor(i / COLS), c = i % COLS;
  const dr = r - state.player.r, dc = c - state.player.c;
  if (!dr && !dc) return eat();
  if (Math.abs(dr) >= Math.abs(dc)) move(Math.sign(dr), 0); else move(0, Math.sign(dc));
});
$('#pad').addEventListener('pointerdown', e => {
  const b = e.target.closest('button'); if (!b) return;
  e.preventDefault(); audioInit();
  const act = b.dataset.act;
  if (act === 'eat') eat(); else move(...DIRS[act]);
});
$('#pauseBtn').onclick = () => pause();
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
// If keyboard focus leaves the game (e.g. a click outside its frame), pause so a click on Resume brings it back.
addEventListener('blur', () => pause());
document.addEventListener('pointerdown', e => {
  if (state.screen === 'play' && !e.target.closest('input,textarea')) grabFocus();
});

/* ---------- Loop ---------- */
let last = performance.now();
function update(dt) {
  if (state.phase === 'boss' && state.boss) { bossUpdate(dt); if (state.screen !== 'play') return; }
  const tutorial = state.phase === 'tutorial';   // the tutorial places its own hint and monster, step by step
  if (!tutorial) {
    if (!state.hintUsed) { state.hintT -= dt; if (state.hintT <= 0) spawnHint(); }
    if (store.monsters === 'off') return;
    state.spawnT -= dt;
    if (state.spawnT <= 0) {
      if (state.mons.length + state.warns.length < maxMons()) startWarning();
      state.spawnT = spawnGap();
    }
  }
  for (const w of [...state.warns]) {
    w.t -= dt;
    if (w.t <= 0) { w.el.remove(); state.warns = state.warns.filter(x => x !== w); addMonster(w); }
  }
  for (const m of [...state.mons]) {
    m.t -= dt;
    if (m.t <= 0) { m.t += moveGap() * MONSTERS[m.type].speed; stepMonster(m); if (state.screen !== 'play') return; }
  }
}
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  if (state.screen === 'play') update(dt);
  updateMusic();
  requestAnimationFrame(frame);
}

// Start up. If saved settings somehow break the menu, reset them and try once more.
function boot() { buildLevel(); showMenu(); }
try { boot(); }
catch (err) {
  console.error('Gobble Grid: startup failed, resetting saved settings', err);
  try { localStorage.removeItem('gobblegrid'); } catch (e) {}
  Object.assign(store, { module: 'g2', topic: 'mix', monsters: 'normal', custom: [], best: {} });
  boot();
}
requestAnimationFrame(frame);
})();
</script>
